site_name: foldcheck
site_description: Validation protocols for applied ML
site_url: https://amina-sb.github.io/foldcheck/
repo_url: https://github.com/amina-sb/foldcheck
repo_name: amina-sb/foldcheck
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
  features: [content.code.copy, navigation.sections]
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc: {permalink: true}
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
nav:
  - Overview: index.md
  - Guides:
      - Splitters: splitters.md
      - Leakage audit: audit.md
      - Intervals and nested CV: inference.md
  - Evidence: evidence.md
  - API reference:
      - foldcheck.splitters: reference/splitters.md
      - foldcheck.audit: reference/audit.md
      - foldcheck.inference: reference/inference.md
